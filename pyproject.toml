[project]
name = "libreria-parcial"
version = "0.1.0"
description = "Módulo de precios para Librería del Centro"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["src"]
markers = [
    "regla1: escenarios de la regla 1",
    "regla2: escenarios de la regla 2",
    "regla3: escenarios de la regla 3",
    "borde: casos de valor limite",
    "error: casos que esperan un error",
    "outline: escenario parametrizado",
    "positivo: casos del camino feliz",
]

[tool.coverage.run]
source = ["src"]
